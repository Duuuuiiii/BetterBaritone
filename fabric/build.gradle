import baritone.gradle.task.CreateDistTask
import baritone.gradle.task.ProguardTask

plugins {
    id "com.github.johnrengelman.shadow" version "8.0.0"
}

archivesBaseName = archivesBaseName + "-fabric"
def betterBaritoneVersion = providers.gradleProperty("betterbaritone_version").get()
def betterBaritoneJar = layout.buildDirectory.file("libs/BetterBaritone-${betterBaritoneVersion}.jar")

unimined.minecraft {
    fabric {
        loader project.fabric_version
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

dependencies {
    // because of multiple sourcesets `common project(":")` doesn't work
    for (sourceSet in rootProject.sourceSets) {
        if (sourceSet == rootProject.sourceSets.test) continue
        if (sourceSet == rootProject.sourceSets.schematica_api) continue
        common sourceSet.output
        shadowCommon sourceSet.output
    }
    include "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"
}

processResources {
    inputs.property "version", betterBaritoneVersion

    filesMatching("fabric.mod.json") {
        expand "version": betterBaritoneVersion
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
    outputs.file(betterBaritoneJar)
    doLast {
        java.nio.file.Files.copy(archiveFile.get().asFile.toPath(), betterBaritoneJar.get().asFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

tasks.register("addonJar", Jar) {
    dependsOn remapJar
    archiveFileName.set("BetterBaritone-Addon-${betterBaritoneVersion}.jar")
    destinationDirectory.set(layout.buildDirectory.dir("libs"))
    from({ zipTree(remapJar.archiveFile.get().asFile) }) {
        include 'baritone/launch/addon/**'
        include 'baritone/launch/BetterBaritoneAddonCompatibility.class'
        include 'baritone/launch/mixins/MixinGui.class', 'baritone/launch/mixins/MixinElytraOnPlayerSoundInstance.class'
        include 'baritone/launch/mixins/MixinFireworkSound.class'
        include 'baritone/process/elytra/ElytraPanel*.class', 'baritone/process/elytra/ElytraUi*.class'
        include 'baritone/process/elytra/ElytraFlightScreen*.class', 'baritone/process/elytra/ElytraFlightHud*.class'
        include 'baritone/process/elytra/ElytraKeybinds*.class', 'baritone/process/elytra/ElytraMileage*.class'
        include 'baritone/process/elytra/ElytraFlightStats*.class', 'baritone/process/elytra/ElytraFlightProfile*.class'
        include 'baritone/process/elytra/AddonFlightState*.class'
        include 'baritone/process/elytra/ElytraSupplyAlerts*.class'
        include 'baritone/process/elytra/ElytraLaunchPlanner*.class'
        include 'baritone/process/elytra/ElytraTripForecast*.class'
        include 'assets/betterbaritone/**', 'LICENSE*'
        include 'mixins.baritone-refmap.json'
        rename 'mixins.baritone-refmap.json', 'mixins.betterbaritone-refmap.json'
    }
    from('src/addon/resources') {
        filesMatching('fabric.mod.json') { expand version: betterBaritoneVersion }
    }
    from(rootProject.file('LICENSE'))
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    archiveClassifier.set "dev"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

task proguard(type: ProguardTask) {
    proguardVersion "7.4.2"
    compType "fabric"
}

task createDist(type: CreateDistTask, dependsOn: proguard) {
    compType "fabric"
}

build.finalizedBy(createDist)

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
